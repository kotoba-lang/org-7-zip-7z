name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('deps.edn') }}
      # p7zip provides the `7z` CLI the oracle tests use; they skip loudly if absent.
      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Run tests
        run: clojure -M:test
      - name: Lint
        run: clojure -M:lint

  cljs:
    name: nbb run-tests.cljs (ClojureScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g nbb@1.4.210
      # nbb has no dependency resolver, so nbb.edn reads its dependencies from
      # sibling checkouts. Pin each to the SHA deps.edn resolves rather than
      # cloning whatever main happens to be — that is how a green CI run can
      # disagree with the pin the consumer actually gets.
      - name: Fetch the pinned dependencies as sibling checkouts
        run: |
          set -eu
          for repo in org-ietf-deflate org-tukaani-xz org-sourceware-bzip2; do
            sha=$(grep "$repo " deps.edn | grep -o '[0-9a-f]\{40\}' | head -1)
            test -n "$sha"
            git clone --quiet "https://github.com/kotoba-lang/$repo.git" "../$repo"
            git -C "../$repo" checkout --quiet "$sha"
            echo "$repo @ $sha"
          done
          # org-tukaani-xz itself needs org-nist-sha2 on the nbb classpath
          sha=$(grep 'org-nist-sha2 ' ../org-tukaani-xz/deps.edn | grep -o '[0-9a-f]\{40\}' | head -1)
          git clone --quiet https://github.com/kotoba-lang/org-nist-sha2.git ../org-nist-sha2
          git -C ../org-nist-sha2 checkout --quiet "$sha"
      - run: nbb run-tests.cljs
