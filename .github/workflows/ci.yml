name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('deps.edn') }}
      # p7zip provides the `7z` CLI the oracle tests use; they skip loudly if absent.
      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Run tests
        run: clojure -M:test
      - name: Lint
        run: clojure -M:lint

  cljs:
    name: nbb run-tests.cljs (ClojureScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g nbb@1.4.210
      - name: Fetch the pinned sibling checkouts
        run: |
          git clone https://github.com/kotoba-lang/org-ietf-deflate.git ../org-ietf-deflate
          git clone https://github.com/kotoba-lang/org-tukaani-xz.git ../org-tukaani-xz
      - run: nbb run-tests.cljs
